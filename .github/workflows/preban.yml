name: Preban Gunpla Check

on:
  schedule:
    # 1時間おき（GitHub Actionsは30分以下の間隔は信頼性が低いため1時間に変更）
    - cron: '0 * * * *'
    # 毎朝8:45 JST = 23:45 UTC（前日）
    - cron: '45 23 * * *'
    # 毎朝9:00 JST = 0:00 UTC（バックアップ用、8:45が失敗した場合の補完）
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      morning:
        description: '朝次サマリーモードで実行（必ず通知）'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Restore seen_items
        id: restore-seen
        uses: actions/cache/restore@v4
        with:
          path: seen_items.json
          key: seen-items-${{ github.run_id }}
          restore-keys: |
            seen-items-

      - name: Run preban check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MORNING_MODE: ${{ (github.event.schedule == '45 23 * * *' || github.event.schedule == '0 0 * * *' || github.event.inputs.morning == 'true') && 'true' || 'false' }}
        run: |
          if [ "$MORNING_MODE" = "true" ]; then
            python scripts/preban.py --morning --seen-file seen_items.json
          else
            python scripts/preban.py --seen-file seen_items.json
          fi
          # ファイルがなければ空のJSONを作成（キャッシュ保存を確実にするため）
          [ -f seen_items.json ] || echo '{}' > seen_items.json

      - name: Save seen_items
        uses: actions/cache/save@v4
        with:
          path: seen_items.json
          key: seen-items-${{ github.run_id }}
